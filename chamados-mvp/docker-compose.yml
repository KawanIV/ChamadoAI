services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chamados
      POSTGRES_USER: chamados
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - chamados_db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U chamados -d chamados"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://chamados:${POSTGRES_PASSWORD}@db:5432/chamados
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      PUBLIC_LINK_SECRET: ${PUBLIC_LINK_SECRET:?defina PUBLIC_LINK_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?defina BOOTSTRAP_ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OLLAMA_URL: http://host.docker.internal:11434
      DEFAULT_MODEL: ${DEFAULT_MODEL:-ternary-bonsai:8b}
    command: ["sh","-c","python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    depends_on:
      db: {condition: service_healthy}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8000:8000"]
    networks: [backend,frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
  web:
    build: .
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [api]
    ports: ["3000:3000"]
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
networks:
  backend: {internal: true}
  frontend: {}
volumes:
  chamados_db: {}
